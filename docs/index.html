<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zelda 64 Player</title>
  <meta name="description" content="Emulador Android para hacks de Zelda 64, com patches BPS/IPS, biblioteca de ROMs próprias e interface inspirada na HOME do Switch." />
  <meta name="color-scheme" content="dark" />
  <meta property="og:title" content="Zelda 64 Player" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="./assets/styles.css" />
  <link rel="icon" type="image/png" href="./assets/app-icon.png" />
  <link rel="apple-touch-icon" href="./assets/app-icon.png" />
</head>
<body>
  <header class="topbar type-zone" data-type-zone>
    <div class="container topbar-inner">
      <div class="brand">
        <img class="logo" src="./assets/app-icon.png" alt="Zelda 64 Player" />
        <span class="brand-text" data-i18n="hero.title.pre"></span>
      </div>
      <nav class="lang-switch" aria-label="Language">
        <button class="lang-btn" data-lang="pt" aria-pressed="false">PT</button>
        <button class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        <button class="lang-btn" data-lang="es" aria-pressed="false">ES</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero type-zone" data-type-zone>
      <div class="hero-bg" aria-hidden="true">
        <iframe src="https://www.youtube.com/embed/CtMllWsML5M?autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=CtMllWsML5M&amp;controls=0&amp;showinfo=0&amp;rel=0&amp;modestbranding=1&amp;playsinline=1&amp;disablekb=1&amp;fs=0" title="Zelda 64 Player background video" frameborder="0" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" loading="eager"></iframe>
      </div>
      <div class="hero-scrim" aria-hidden="true"></div>
      <div class="container hero-content">
        <h1><span data-i18n="hero.title.pre"></span> <span class="accent" data-i18n="hero.title.accent"></span></h1>
        <p data-i18n="hero.subtitle"></p>
        <div class="hero-badges">
          <span class="badge"><b data-i18n="hero.badge1"></b></span>
          <span class="badge"><b data-i18n="hero.badge2"></b></span>
          <span class="badge"><b data-i18n="hero.badge3"></b></span>
        </div>
      </div>
    </section>

    <section class="section type-zone" id="features" data-type-zone>
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="features.title"></h2>
          <span class="sub" data-i18n="features.sub"></span>
        </div>
        <div class="feature-grid" id="feature-grid"></div>
      </div>
    </section>

    <section class="section type-zone" id="catalog" data-type-zone>
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="catalog.title"></h2>
          <span class="sub" data-i18n="catalog.sub"></span>
        </div>
        <div id="catalog-count" class="sub" style="margin-bottom:18px;color:var(--text-secondary);"></div>
        <div id="catalog-state" class="catalog-state"></div>
        <div class="catalog-grid" id="catalog-grid"></div>
      </div>
    </section>

    <section class="section type-zone" id="download" data-type-zone>
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="download.title"></h2>
          <span class="sub" data-i18n="download.sub"></span>
        </div>
        <div class="download-card">
          <div class="download-info">
            <p class="download-lead" data-i18n="download.lead"></p>
            <p class="download-meta">
              <span data-i18n="download.versionLabel"></span>
              <span id="download-version" class="download-version">v1.0.1</span>
              <span id="download-date" class="download-date"></span>
            </p>
          </div>
          <a class="btn-download" id="download-btn"
             href="https://github.com/zonaro/zelda64player/releases"
             target="_blank" rel="noopener">
            <span class="btn-download-icon hylian-symbol" aria-hidden="true">a</span>
            <span data-i18n="download.button"></span>
          </a>
        </div>
        <p class="download-note" data-i18n="download.note"></p>
      </div>
    </section>

    <section class="section type-zone" id="legal" data-type-zone>
      <div class="container">
        <div class="legal">
          <h3 data-i18n="legal.title"></h3>
          <p data-i18n="legal.text"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer type-zone" data-type-zone>
    <div class="container">
      <p data-i18n="footer.text"></p>
      <p><a href="https://github.com/zonaro/zelda64player" target="_blank" rel="noopener" data-i18n="footer.source"></a></p>
    </div>
  </footer>

  <script src="./assets/app.js"></script>
</body>
</html>
